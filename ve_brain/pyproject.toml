[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ve_brain"
version = "0.1.3"
description = "VE Brain — versioned installable decision-brain (N1-N6 contracts, adapted EV engine, regime routing) supplied by the Validation Engine to the AI Trader."
requires-python = ">=3.11"
dependencies = []                     # stdlib-only; NU depinde de branch-ul de dezvoltare, NU reconstruiește detectoare

[project.urls]
# branch discovery-mk-matrix-v1; measurement-source commit dc28e4a (vezi ve_brain.version.SOURCE_COMMIT);
# validated core fbc0f20 (ve_brain.VALIDATED_CORE_COMMIT). URL valid (cerut de setuptools).
Source = "https://github.com/rzvqp/ai_quant_lab-alpha-discovery"

[tool.setuptools.packages.find]
where = ["."]
include = ["ve_brain*"]
