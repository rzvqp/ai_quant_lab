[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ve-tower-worker"
version = "0.1.0"
description = "Isolated worker process hosting ve_tower (N3/N4) behind a versioned local IPC boundary. Never imports ai_trader. Never installed in the AI Trader venv."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ve-tower-worker = "ve_tower_worker.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
