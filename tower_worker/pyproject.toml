[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ve-tower-worker"
version = "0.3.0"
description = "Isolated worker process hosting ve_tower's real_decision -- exclusively ve_tower.run_tower_chain (N2/N3/N4) -- behind a versioned local IPC boundary (protocol v3, chain-based). Never imports ai_trader. Never installed in the AI Trader venv."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ve-tower-worker = "ve_tower_worker.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
