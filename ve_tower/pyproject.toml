[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ve_tower"
version = "0.5.1"
description = "VE Tower — official N1-N4 level-tower phenomena provider (regime, bias, zone map, zone confirmation) supplied by the Validation Engine to the AI Trader. Vendors the ratified modules byte-identical; feeds ve_brain.DecisionRequest."
requires-python = ">=3.12"                 # level_output.py folosește generice PEP-695 (type/Ok[T]) — 3.12+
dependencies = ["numpy>=1.24", "pandas>=2.0"]   # turnul face matematică pe bare; NU e stdlib-only (spre deosebire de ve_brain)

[project.urls]
# branch discovery-mk-matrix-v1; module vendate byte-identic (vezi ve_tower.version.VENDORED_SOURCE_COMMITS);
# freeze lanț N1->N6 ad8b586. URL valid cerut de setuptools.
Source = "https://github.com/rzvqp/ai_quant_lab-alpha-discovery"

[tool.setuptools.packages.find]
where = ["."]
include = ["ve_tower*"]

[tool.setuptools.package-data]
ve_tower = ["_tower/*.py"]                 # modulele vendate se livrează în wheel ca date de pachet
