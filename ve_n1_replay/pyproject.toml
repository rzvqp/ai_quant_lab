[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ve_n1_replay"
version = "0.4.0"
description = "VE N1 Replay — standalone canonical N1 (RawAxes/applicable_regimes/Router) replay for Alpha. Vendors AI Trader's RawAxesBuilder @21ae632 + the pinned detectors @61cbd58c byte-identical, in an isolated namespace; consumes ve_brain 0.1.3 as an external pinned wheel. No ai_trader/ve_tower/MT5/broker at runtime."
requires-python = ">=3.12"
# ve_brain 0.1.3 is an EXTERNAL PINNED WHEEL (SHA-256 edd208ad…987d11), installed separately in the tower venv;
# it is not on PyPI so it is not listed here. numpy is required by the vendored detectors (market_state).
dependencies = ["numpy>=1.24"]

[project.urls]
# AI Trader source @21ae632 (wp5b); detectors @ submodule pin 61cbd58c (ai_quant_lab-alpha-automation). URL valid.
Source = "https://github.com/rzvqp/ai_quant_lab-alpha-discovery"

[tool.setuptools.packages.find]
where = ["."]
include = ["ve_n1_replay"]
exclude = ["ve_n1_replay._ai*", "ve_n1_replay._det*", "ve_n1_replay.tests*"]

[tool.setuptools.package-data]
# vendored closure ships as package DATA (loaded by path via _bootstrap, NOT discovered/imported as packages)
ve_n1_replay = ["_ai/**/*.py", "_ai/.gitattributes", "_det/*.py", "_det/.gitattributes"]
